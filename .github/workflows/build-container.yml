name: Build Cloudflare container

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.cloudflare.com
          username: ${{ secrets.CF_REGISTRY_USERNAME }}
          password: ${{ secrets.CF_REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            registry.cloudflare.com/e216b35633d32ecc2a61a21369976716/savefromnet-final:latest
            registry.cloudflare.com/e216b35633d32ecc2a61a21369976716/savefromnet-final:${{ github.sha }}
