<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Downloader</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar border-bottom border-secondary-subtle mb-4">
  <div class="container">
    <span class="navbar-brand fw-semibold mb-0">
      <span class="brand-dot"></span> YouTube Downloader
    </span>
    <span class="text-secondary small">powered by yt-dlp</span>
  </div>
</nav>

<main class="container pb-5" style="max-width: 820px;">

  {% if not ytdlp_ok %}
  <div class="alert alert-warning" role="alert">
    <strong>yt-dlp was not found on this server.</strong>
    Install it (<code>pip install yt-dlp</code>) and restart the app.
  </div>
  {% endif %}

  <div class="card shadow-sm mb-4">
    <div class="card-body p-4">
      <form id="download-form" novalidate>
        <div class="mb-3">
          <label for="url" class="form-label fw-medium">Video URL</label>
          <input type="url" class="form-control form-control-lg" id="url"
                 placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" required>
          <div class="invalid-feedback" id="url-error"></div>
        </div>

        <div class="row g-3 align-items-end">
          <div class="col-sm-6">
            <label for="quality" class="form-label fw-medium">Quality</label>
            <select class="form-select" id="quality">
              <option value="best" selected>Best available</option>
              <option value="1080p">1080p</option>
              <option value="720p">720p</option>
              <option value="480p">480p</option>
              <option value="audio">Audio only (MP3)</option>
            </select>
          </div>
          <div class="col-sm-6">
            <button type="submit" class="btn btn-primary w-100" id="submit-btn">
              Download
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm mb-4 d-none" id="progress-card">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <div class="me-3">
          <div class="fw-medium" id="job-title">Preparing…</div>
          <div class="text-secondary small" id="job-stage">Queued</div>
        </div>
        <div class="text-end">
          <div class="fs-4 fw-semibold" id="job-percent">0%</div>
          <div class="text-secondary small" id="job-meta"></div>
        </div>
      </div>
      <div class="progress" role="progressbar" style="height: 10px;">
        <div class="progress-bar progress-bar-striped progress-bar-animated"
             id="progress-bar" style="width: 0%"></div>
      </div>
      <div class="mt-3 d-none" id="job-result"></div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-2">
    <h2 class="h5 mb-0">History</h2>
    <button class="btn btn-sm btn-outline-secondary" id="refresh-history">Refresh</button>
  </div>
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr class="text-secondary small">
            <th>Title</th><th>Quality</th><th>Status</th><th>When</th><th></th>
          </tr>
        </thead>
        <tbody id="history-body">
          <tr><td colspan="5" class="text-secondary py-4 text-center">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
